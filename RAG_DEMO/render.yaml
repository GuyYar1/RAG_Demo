yamlservices:
  - type: web
    name: dr-medical-assistant
    runtime: python
    pythonVersion: "3.11"  # Added Python version here
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1  # Workers added
    envVars:
      - key: GROQ_API_KEY
        sync: false

services:
  - type: web
    name: dr-medical-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: vector-store-disk
      mountPath: /opt/render/project/src
      sizeGB: 1